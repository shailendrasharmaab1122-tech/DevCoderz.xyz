<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Toppers - Subject Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50/30 to-yellow-50/50 min-h-screen pb-20">
    <nav class="h-20 bg-white/80 backdrop-blur-md border-b border-amber-100/60 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-10 h-10 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-700 hover:bg-amber-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 id="navTitle" class="font-extrabold text-gray-900 text-lg tracking-tight">Subject Content</h1>
                <p class="text-xs font-semibold text-amber-600">Explore Folders & Files</p>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-6">
        <div class="flex items-center justify-between mb-4">
            <h3 id="sectionTitle" class="text-base font-extrabold text-gray-900">Contents</h3>
            <span id="contentCount" class="text-xs font-bold text-gray-500 bg-white px-3 py-1 rounded-lg border border-amber-100 shadow-sm">Loading...</span>
        </div>

        <div id="contentContainer" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <div class="col-span-full flex flex-col items-center justify-center py-16">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-sm font-bold text-gray-500">Loading contents...</p>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get("batchId") || "178";
        const folderId = params.get("folderId");
        const titleParam = params.get("title");

        if (titleParam) {
            document.getElementById('navTitle').innerText = decodeURIComponent(titleParam);
        }

        async function fetchFolderContent() {
            if (!folderId) {
                document.getElementById('contentContainer').innerHTML = '<div class="col-span-full text-center py-16 text-rose-500 font-semibold bg-white rounded-2xl border border-amber-100">Folder ID missing.</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.thescholarverse.site/nexttoppers/course/all-content/${batchId}?limit=1000&folder_id=${folderId}`);
                const json = await res.json();
                const items = json.data || [];
                const container = document.getElementById('contentContainer');
                const countBadge = document.getElementById('contentCount');
                container.innerHTML = '';

                if (items.length === 0) {
                    countBadge.innerText = '0 Items';
                    container.innerHTML = '<div class="col-span-full text-center py-16 text-gray-500 font-semibold bg-white rounded-2xl border border-amber-100">No content found in this folder.</div>';
                    return;
                }

                countBadge.innerText = `${items.length} Items`;

                items.forEach(item => {
                    const type = item.type; // 'folder' or 'file'
                    const entityId = item.entity_id || (item.data && item.data.id);
                    const title = item.title || (item.data && item.data.title) || 'Untitled';
                    const thumbnail = (item.data && item.data.thumbnail) || 'https://via.placeholder.com/150';

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl border border-amber-100 shadow-sm hover:shadow-xl hover:border-amber-300 transition-all duration-300 p-5 flex items-center gap-4 cursor-pointer group";

                    if (type === 'folder') {
                        const counts = item.data && item.data.content_counts ? item.data.content_counts : null;
                        card.onclick = () => window.location.href = `subject.html?batchId=${batchId}&folderId=${entityId}&title=${encodeURIComponent(title)}`;
                        
                        card.innerHTML = `
                            <div class="w-14 h-14 rounded-xl bg-amber-50 border border-amber-100 flex-shrink-0 flex items-center justify-center text-amber-600 group-hover:bg-amber-500 group-hover:text-white transition-all">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-gray-900 text-base mb-1 group-hover:text-amber-600 transition-colors truncate">${title}</h4>
                                ${counts ? `
                                    <div class="flex items-center gap-2 text-xs font-semibold text-gray-400">
                                        <span>Videos: ${counts.video ? counts.video.paid : 0}</span>
                                        <span>•</span>
                                        <span>Notes: ${counts.pdf ? counts.pdf.paid : 0}</span>
                                    </div>
                                ` : `<p class="text-xs text-gray-400 font-semibold">Tap to open folder</p>`}
                            </div>
                            <div class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-white transition-all">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                            </div>
                        `;
                    } else if (type === 'file') {
                        let videoUrl = '';
                        try {
                            const downloadUrls = JSON.parse(item.data.download_urls || '[]');
                            if (downloadUrls.length > 0) {
                                // Prefer 360p or 480p or pick the first available url
                                const preferred = downloadUrls.find(u => u.title === '360p30' || u.title === '480p30') || downloadUrls[0];
                                videoUrl = preferred.url;
                            }
                        } catch (err) {
                            console.error("Error parsing download URLs", err);
                        }

                        card.onclick = () => {
                            if (videoUrl) {
                                window.location.href = `player.html?Url=${encodeURIComponent(videoUrl)}`;
                            } else {
                                alert("Video link not available.");
                            }
                        };

                        card.innerHTML = `
                            <div class="w-14 h-14 rounded-xl bg-amber-50 border border-amber-100 overflow-hidden flex-shrink-0 flex items-center justify-center">
                                <img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/150'">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-gray-900 text-base mb-1 group-hover:text-amber-600 transition-colors truncate">${title}</h4>
                                <span class="inline-block bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full">VIDEO LECTURE</span>
                            </div>
                            <div class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-white transition-all">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                        `;
                    }

                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('contentCount').innerText = 'Error';
                document.getElementById('contentContainer').innerHTML = '<div class="col-span-full text-center py-16 text-rose-500 font-semibold bg-white rounded-2xl border border-amber-100">Failed to load folder contents. Please try again later.</div>';
            }
        }

        fetchFolderContent();
    </script>
</body>
</html>

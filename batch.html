<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Toppers - Batch Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50/30 to-yellow-50/50 min-h-screen pb-20">
    <nav class="h-20 bg-white/80 backdrop-blur-md border-b border-amber-100/60 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-10 h-10 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-700 hover:bg-amber-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="font-extrabold text-gray-900 text-lg tracking-tight">Batch Details</h1>
                <p class="text-xs font-semibold text-amber-600">Subjects & Content</p>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-6">
        <section id="liveSection" class="mb-8 hidden">
            <h3 class="text-base font-extrabold text-gray-900 mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span> Live Classes
            </h3>
            <div id="liveContainer" class="flex gap-4 overflow-x-auto hide-scrollbar pb-2"></div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-extrabold text-gray-900">Subjects & Folders</h3>
                <span id="subjectCount" class="text-xs font-bold text-gray-500 bg-white px-3 py-1 rounded-lg border border-amber-100 shadow-sm">Loading...</span>
            </div>

            <div id="subjectsContainer" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                <div class="col-span-full flex flex-col items-center justify-center py-16">
                    <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-sm font-bold text-gray-500">Loading batch contents...</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get("batchId");

        async function fetchBatchData() {
            if (!batchId) {
                document.getElementById('subjectsContainer').innerHTML = '<div class="col-span-full text-center py-16 text-rose-500 font-semibold bg-white rounded-2xl border border-amber-100">Invalid Batch ID.</div>';
                return;
            }

            // Fetch Live Classes
            try {
                const liveRes = await fetch(`https://devcoderz-ebon.vercel.app/api/hehe?path`);
                const liveJson = await liveRes.json();
                const liveClasses = liveJson.data || [];
                if (liveClasses.length > 0) {
                    const liveSection = document.getElementById('liveSection');
                    const liveContainer = document.getElementById('liveContainer');
                    liveSection.classList.remove('hidden');
                    liveContainer.innerHTML = '';
                    liveClasses.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "min-w-[280px] max-w-[280px] bg-white rounded-2xl border border-amber-100 shadow-sm p-4 flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <span class="inline-block bg-rose-100 text-rose-600 text-[10px] font-extrabold px-2 py-0.5 rounded-full mb-2 uppercase">LIVE NOW</span>
                                <h4 class="font-bold text-gray-900 text-sm mb-2 line-clamp-2">${item.title || 'Untitled Live Class'}</h4>
                            </div>
                            <button onclick="window.location.href='player.html?videoId=${item._id}&batchId=${batchId}'" class="mt-4 w-full bg-rose-500 hover:bg-rose-600 text-white py-2 rounded-xl text-xs font-bold shadow-md transition">Join Live</button>
                        `;
                        liveContainer.appendChild(card);
                    });
                }
            } catch (e) {
                console.error("Error fetching live classes", e);
            }

            // Fetch Course Content / Subjects
            try {
                const res = await fetch(`https://devcoderz-ebon.vercel.app/api/hehe?path=course/all-content/${batchId}?limit=1000`);
                const json = await res.json();
                const items = json.data || [];
                const container = document.getElementById('subjectsContainer');
                const countBadge = document.getElementById('subjectCount');
                container.innerHTML = '';

                if (items.length === 0) {
                    countBadge.innerText = '0 Subjects';
                    container.innerHTML = '<div class="col-span-full text-center py-16 text-gray-500 font-semibold bg-white rounded-2xl border border-amber-100">No content available in this batch.</div>';
                    return;
                }

                countBadge.innerText = `${items.length} Subjects`;

                items.forEach(item => {
                    const entityId = item.entity_id || (item.data && item.data.id);
                    const title = item.title || (item.data && item.data.title) || 'Untitled';
                    const thumbnail = (item.data && item.data.thumbnail) || 'https://via.placeholder.com/150';
                    const counts = item.data && item.data.content_counts ? item.data.content_counts : null;

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl border border-amber-100 shadow-sm hover:shadow-xl hover:border-amber-300 transition-all duration-300 p-5 flex items-center gap-4 cursor-pointer group";
                    card.onclick = () => window.location.href = `subject.html?batchId=${batchId}&folderId=${entityId}&title=${encodeURIComponent(title)}`;

                    card.innerHTML = `
                        <div class="w-16 h-16 rounded-xl bg-amber-50 border border-amber-100 overflow-hidden flex-shrink-0 flex items-center justify-center">
                            <img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/150'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-gray-900 text-base mb-1 group-hover:text-amber-600 transition-colors truncate">${title}</h4>
                            ${counts ? `
                                <div class="flex items-center gap-2 text-xs font-semibold text-gray-400">
                                    <span>Videos: ${counts.video ? counts.video.paid : 0}</span>
                                    <span>•</span>
                                    <span>Notes: ${counts.pdf ? counts.pdf.paid : 0}</span>
                                </div>
                            ` : `<p class="text-xs text-gray-400 font-semibold">Tap to explore</p>`}
                        </div>
                        <div class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-white transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('subjectCount').innerText = 'Error';
                document.getElementById('subjectsContainer').innerHTML = '<div class="col-span-full text-center py-16 text-rose-500 font-semibold bg-white rounded-2xl border border-amber-100">Failed to load batch content. Please try again later.</div>';
            }
        }

        fetchBatchData();
    </script>
</body>
</html>

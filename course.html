<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Toppers - Premium Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50/30 to-yellow-50/50 min-h-screen pb-20">
    <nav class="h-20 bg-white/80 backdrop-blur-md border-b border-amber-100/60 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center shadow-md shadow-amber-500/20">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            </div>
            <div>
                <h1 class="font-extrabold text-gray-900 text-lg tracking-tight">Next Toppers</h1>
                <p class="text-xs font-semibold text-amber-600">Excellence in Learning</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                <span class="w-2 h-2 mr-1.5 bg-amber-500 rounded-full animate-pulse"></span> Premium Batches
            </span>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-8 pb-4">
        <div class="bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 rounded-2xl p-6 md:p-8 text-white shadow-xl shadow-amber-500/10 relative overflow-hidden flex flex-col md:flex-row items-center justify-between">
            <div class="absolute -right-10 -bottom-10 w-60 h-60 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="relative z-10 max-w-xl mb-6 md:mb-0">
                <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 inline-block backdrop-blur-sm">New Session 2026-27</span>
                <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-2">Achieve Your Dream Rank with Expert Guidance</h2>
                <p class="text-amber-50 text-sm font-medium leading-relaxed">Choose from our top-tier structured courses designed for ultimate success.</p>
            </div>
            <div class="relative z-10 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-4 text-center min-w-[140px]">
                <span class="block text-2xl font-extrabold text-white">100%</span>
                <span class="text-xs font-medium text-amber-100">Quality Education</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-4">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-extrabold text-gray-900 flex items-center gap-2">
                <span>Explore Courses</span>
            </h3>
            <span id="courseCount" class="text-xs font-bold text-gray-500 bg-white px-3 py-1 rounded-lg border border-amber-100 shadow-sm">Loading...</span>
        </div>

        <div id="coursesContainer" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <div class="col-span-full flex flex-col items-center justify-center py-16">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-sm font-bold text-gray-500">Loading your courses...</p>
            </div>
        </div>
    </main>

    <script>
        async function fetchCourses() {
            try {
                const res = await fetch('https://api.thescholarverse.site/nexttoppers/course/all-course');
                const json = await res.json();
                const courseListObj = (json.data || []).find(item => item.layout_type === 'course_list_layout');
                const courses = courseListObj ? courseListObj.list : [];
                const container = document.getElementById('coursesContainer');
                const countBadge = document.getElementById('courseCount');
                container.innerHTML = '';
                
                if (courses.length === 0) {
                    countBadge.innerText = '0 Courses';
                    container.innerHTML = '<div class="col-span-full text-center py-16 text-gray-500 font-semibold bg-white rounded-2xl border border-amber-100">No courses available at the moment.</div>';
                    return;
                }

                countBadge.innerText = `${courses.length} Courses`;

                courses.forEach(course => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl border border-amber-100 shadow-sm hover:shadow-xl hover:border-amber-300 transition-all duration-300 flex flex-col justify-between overflow-hidden group cursor-pointer";
                    card.onclick = () => window.location.href = `batch.html?batchId=${course.id}`;
                    
                    const discount = course.discount_percentage ? Math.round(course.discount_percentage) : 0;
                    
                    card.innerHTML = `
                        <div class="relative overflow-hidden bg-amber-50">
                            <img src="${course.thumbnail || 'https://via.placeholder.com/300x150'}" alt="${course.title}" class="w-full h-44 object-cover group-hover:scale-105 transition-transform duration-500">
                            ${discount > 0 ? `<span class="absolute top-3 left-3 bg-gradient-to-r from-amber-500 to-yellow-500 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow-md">${discount}% OFF</span>` : ''}
                            ${course.is_new ? `<span class="absolute top-3 right-3 bg-emerald-500 text-white text-xs font-extrabold px-2.5 py-1 rounded-full shadow-md">NEW</span>` : ''}
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-900 text-base mb-3 group-hover:text-amber-600 transition-colors line-clamp-2">${course.title || 'Untitled Course'}</h3>
                            </div>
                            <div>
                                <div class="flex items-baseline gap-2 mb-4 pt-2 border-t border-gray-100">
                                    <span class="text-xl font-extrabold text-amber-600">₹${course.offer_price || '0'}</span>
                                    <span class="text-sm font-semibold text-gray-400 line-through">₹${course.mrp || '0'}</span>
                                </div>
                                <button class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white py-2.5 rounded-xl text-sm font-bold shadow-md shadow-amber-500/20 transition-all active:scale-[0.98]">
                                    Explore Batch
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('courseCount').innerText = 'Error';
                document.getElementById('coursesContainer').innerHTML = '<div class="col-span-full text-center py-16 text-rose-500 font-semibold bg-white rounded-2xl border border-amber-100">Failed to load courses. Please try again later.</div>';
            }
        }
        fetchCourses();
    </script>
</body>
</html>
